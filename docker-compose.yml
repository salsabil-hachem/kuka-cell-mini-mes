services:

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mes-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7
    container_name: mes-influxdb
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: kukamesadmin
      DOCKER_INFLUXDB_INIT_ORG: mes
      DOCKER_INFLUXDB_INIT_BUCKET: kuka_cell
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: kuka-mes-token
    volumes:
      - influx-data:/var/lib/influxdb2
    restart: unless-stopped

  nodered:
    image: nodered/node-red:latest
    container_name: mes-nodered
    ports:
      - "1880:1880"
    environment:
      TZ: Africa/Tunis
    volumes:
      - ./nodered:/data
    depends_on:
      - mosquitto
      - influxdb
    restart: unless-stopped

volumes:
  influx-data: